name: Tests


on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      foo:
        type: string
        default: "{bool: true}"

jobs:
  call:
    name: test 1
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo ${{ inputs.foo }}
          echo ${{ fromJSON('["is false", "is true"]')[fromJSON(inputs.foo).bool == 'true'] }}
          echo ${{ fromJSON('["is false", "is true"]')[fromJSON(inputs.foo).bool == true] }}
